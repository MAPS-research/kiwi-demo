name: Validate and deploy demo to AWS S3

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kiwi-demo-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build static demo
        run: npm run build
      - name: Validate static files
        run: python3 scripts/check-deployment.py
      - name: Upload static build
        uses: actions/upload-artifact@v6
        with:
          name: demo-dist
          path: dist/
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download static build
        uses: actions/download-artifact@v7
        with:
          name: demo-dist
          path: dist/
      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::211933323811:role/kiwi-demo-github-deploy
          role-session-name: kiwi-demo-${{ github.run_id }}
          aws-region: ap-southeast-1
          allowed-account-ids: '211933323811'
      - name: Publish and verify demo
        run: bash scripts/deploy-s3.sh --apply
